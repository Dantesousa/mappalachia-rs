[package]
name = "mappalachia-render"
version = "0.1.0"
edition = "2021"

[dependencies]
mappalachia-core = { path = "../core" }
tiny-skia = "0.11"
resvg = "0.45"
image = "0.25"
fontdue = "0.9"
csscolorparser = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
